---
name: "CI"

permissions:
  contents: read

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:  # yamllint disable-line rule:truthy
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  changelog:
    if: >-
      github.event_name == 'pull_request'
      && !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout collection
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: "0"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate changelog
        run: >-
          python .github/scripts/validate_changelog.py
          --ref "${{ github.event.pull_request.base.ref }}"

  build-import:
    runs-on: ubuntu-latest
    env:
      GALAXY_IMPORTER_CONFIG: /tmp/galaxy-importer.cfg
    steps:
      - name: Checkout collection
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Install dependencies
        run: pip install ansible-core galaxy-importer

      - name: Configure galaxy-importer
        run: |
          cat > /tmp/galaxy-importer.cfg << EOF
          [galaxy-importer]
          CHECK_REQUIRED_TAGS = True
          EOF

      - name: Build and import collection
        run: python -m galaxy_importer.main --git-clone-path . --output-path /tmp

  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout collection
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.14"

      - name: Install ansible-lint
        run: pip install ansible-lint

      - name: Run ansible-lint
        run: ansible-lint

  sanity-matrix:
    name: "Matrix Sanity"
    runs-on: ubuntu-latest
    outputs:
      envlist: ${{ steps.generate.outputs.envlist }}
    steps:
      - name: Checkout collection
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.14"

      - name: Install tox-ansible
        run: pip install tox-ansible

      - name: Generate matrix
        id: generate
        run: >-
          python -m tox --ansible --gh-matrix --matrix-scope sanity
          --conf tox-ansible.ini

  sanity:
    needs: sanity-matrix
    name: "${{ matrix.entry.name }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJson(needs.sanity-matrix.outputs.envlist) }}
    continue-on-error: >-
      ${{ contains(matrix.entry.name, 'devel')
      || contains(matrix.entry.name, 'milestone') }}
    steps:
      - name: Checkout collection
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: "0"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "${{ matrix.entry.python }}"

      - name: Install tox-ansible
        run: pip install tox-ansible

      - name: Run sanity tests
        run: >-
          python -m tox --ansible -e "${{ matrix.entry.name }}"
          --conf tox-ansible.ini
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  unit-galaxy-matrix:
    name: "Matrix Unit"
    runs-on: ubuntu-latest
    outputs:
      envlist: ${{ steps.generate.outputs.envlist }}
    steps:
      - name: Checkout collection
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.14"

      - name: Install tox-ansible
        run: pip install tox-ansible

      - name: Generate matrix
        id: generate
        run: >-
          python -m tox --ansible --gh-matrix --matrix-scope unit
          --conf tox-ansible.ini

  unit-galaxy:
    needs: unit-galaxy-matrix
    name: "${{ matrix.entry.name }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJson(needs.unit-galaxy-matrix.outputs.envlist) }}
    continue-on-error: >-
      ${{ contains(matrix.entry.name, 'devel')
      || contains(matrix.entry.name, 'milestone') }}
    steps:
      - name: Checkout collection
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: "0"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "${{ matrix.entry.python }}"

      - name: Install tox-ansible
        run: pip install tox-ansible

      - name: Install build dependencies
        if: matrix.entry.python >= '3.12'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libssh-dev

      - name: Run unit tests
        run: >-
          python -m tox --ansible -e "${{ matrix.entry.name }}"
          --conf tox-ansible.ini
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  unit-source:
    name: "py${{ matrix.python-version }} / ${{ matrix.ansible-version }}"
    runs-on: ubuntu-latest
    env:
      PY_COLORS: "1"
    continue-on-error: ${{ matrix.ansible-version == 'devel' }}
    strategy:
      fail-fast: false
      matrix:
        ansible-version:
          - stable-2.16
          - stable-2.17
          - stable-2.18
          - stable-2.19
          - stable-2.20
          - devel
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
        exclude:
          - ansible-version: stable-2.16
            python-version: "3.12"
          - ansible-version: stable-2.16
            python-version: "3.13"
          - ansible-version: stable-2.16
            python-version: "3.14"
          - ansible-version: stable-2.17
            python-version: "3.13"
          - ansible-version: stable-2.17
            python-version: "3.14"
          - ansible-version: stable-2.18
            python-version: "3.10"
          - ansible-version: stable-2.18
            python-version: "3.14"
          - ansible-version: stable-2.19
            python-version: "3.10"
          - ansible-version: stable-2.19
            python-version: "3.14"
          - ansible-version: stable-2.20
            python-version: "3.10"
          - ansible-version: stable-2.20
            python-version: "3.11"
          - ansible-version: stable-2.20
            python-version: "3.14"
          - ansible-version: devel
            python-version: "3.10"
          - ansible-version: devel
            python-version: "3.11"
          - ansible-version: devel
            python-version: "3.12"
          - ansible-version: devel
            python-version: "3.14"
    steps:
      - name: Checkout collection
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: "0"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Install build dependencies
        if: matrix.python-version >= '3.12'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libssh-dev

      - name: Install ansible-core (${{ matrix.ansible-version }})
        run: >-
          pip install
          https://github.com/ansible/ansible/archive/${{ matrix.ansible-version }}.tar.gz
          --disable-pip-version-check

      - name: Install collection dependencies
        run: >-
          ansible-galaxy collection install --pre
          git+https://github.com/ansible-collections/ansible.utils.git
          -p "$HOME/.ansible/collections"

      - name: Build and install collection
        run: |
          ansible-galaxy collection build -vvv
          ansible-galaxy collection install ./branic-system_management-*.tar.gz \
            --pre -p "$HOME/.ansible/collections"
          cp galaxy.yml \
            "$HOME/.ansible/collections/ansible_collections/branic/system_management/galaxy.yml"

      - name: Install test dependencies
        run: pip install pytest-ansible pytest-xdist

      - name: Print diagnostics
        run: |
          ansible --version
          python3 -m pip list

      - name: Run unit tests
        run: |
          cd "$HOME/.ansible/collections/ansible_collections/branic/system_management"
          python -m pytest tests/unit -vvv --showlocals \
            --ansible-host-pattern localhost

  all_green:
    if: ${{ always() && !cancelled() }}
    needs:
      - changelog
      - build-import
      - ansible-lint
      - sanity
      - unit-galaxy
      - unit-source
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs succeeded
        env:
          R_CHANGELOG: ${{ needs.changelog.result }}
          R_BUILD_IMPORT: ${{ needs['build-import'].result }}
          R_ANSIBLE_LINT: ${{ needs['ansible-lint'].result }}
          R_SANITY: ${{ needs.sanity.result }}
          R_UNIT_GALAXY: ${{ needs['unit-galaxy'].result }}
          R_UNIT_SOURCE: ${{ needs['unit-source'].result }}
        run: |
          import os

          results = {
              "changelog": os.environ["R_CHANGELOG"],
              "build-import": os.environ["R_BUILD_IMPORT"],
              "ansible-lint": os.environ["R_ANSIBLE_LINT"],
              "sanity": os.environ["R_SANITY"],
              "unit-galaxy": os.environ["R_UNIT_GALAXY"],
              "unit-source": os.environ["R_UNIT_SOURCE"],
          }
          must_succeed = (
              "build-import",
              "ansible-lint",
              "sanity",
              "unit-galaxy",
              "unit-source",
          )
          for name in must_succeed:
              r = results[name]
              assert r == "success", f"{name}: expected success, got {r!r}"
          cl = results["changelog"]
          assert cl in ("success", "skipped"), (
              f"changelog: expected success or skipped, got {cl!r}"
          )
        shell: python
