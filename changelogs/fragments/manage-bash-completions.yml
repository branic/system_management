---
minor_changes:
  - >-
    Add ``manage_bash_completions`` role to maintain a shared lazy-loaded bash
    completion section in ``~/.bashrc``, replacing per-role template management.
  - >-
    Add ``merge_bashrc_completions`` filter plugin for idempotent merging of
    provider-scoped bash completion entries with legacy format migration.
  - >-
    install_cloud_clis and openshift_local roles now delegate bash completion
    management to the shared ``manage_bash_completions`` role.
bugfixes:
  - >-
    merge_bashrc_completions filter plugin -- fix legacy one-liner regex
    patterns that contained a stray ``>`` after the closing parenthesis,
    preventing removal of old ``source <(cmd completion bash)`` lines during
    migration.
