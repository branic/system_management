---
# Internal: bash completion metadata for openshift_local (passed to manage_bash_completions).

openshift_local_bash_completion_cmds:
  - crc

openshift_local_bash_completion_entries:
  - cmd: crc
    type: lazy
    generator: [crc, completion, bash]

# Internal: GitHub API base for crc-org/crc (releases list and release-by-tag).
__openshift_local_crc_github_api_base: https://api.github.com/repos/crc-org/crc

# Internal: GitHub Releases API (first page item = newest by publish date).
__openshift_local_crc_github_releases_latest: "{{ __openshift_local_crc_github_api_base }}/releases?per_page=1"

# Internal: Red Hat content-gateway root per CRC semver; archive is crc-linux-<arch>.tar.xz below it.
__openshift_local_crc_clients_crc_root: >-
  https://developers.redhat.com/content-gateway/file/pub/cgw/crc

# Internal: RPM names checked (and optionally installed) on Fedora/RHEL family hosts.
__openshift_local_host_packages:
  - libvirt
  - NetworkManager

# Per-preset minimums aligned with CRC docs and pkg/crc/constants (defaults / validation).
# Host_* = physical system requirements (https://crc.dev/docs/using/).
# crc_* = minimum valid crc config values (cpus, memory MiB, disk-size GiB).
__openshift_local_preset_minimums:
  openshift:
    host_cpus: 4
    host_memory_mb: 10752
    host_disk_free_gb: 35
    crc_cpus: 4
    crc_memory_mib: 10752
    crc_disk_size_gib: 31
  okd:
    host_cpus: 4
    host_memory_mb: 10752
    host_disk_free_gb: 35
    crc_cpus: 4
    crc_memory_mib: 10752
    crc_disk_size_gib: 31
  microshift:
    host_cpus: 2
    host_memory_mb: 4096
    host_disk_free_gb: 35
    crc_cpus: 2
    crc_memory_mib: 4096
    crc_disk_size_gib: 31
